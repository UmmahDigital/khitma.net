<div class="center-center fx-row-wrap" style="height: 100%">
  <div id="app-container" [class.dark]="isDarkStyle" [class.wide]="isWide">
    @if (showCelebration) {
      <app-celebration class="celebration-container">
      </app-celebration>
    }

    @if (!isWide) {
    <mat-toolbar color="primary">
      <button type="button" mat-icon-button (click)="openMenu()" [attr.aria-label]="common.translation.menu?.open || 'القائمة'">
        <mat-icon>menu</mat-icon>
      </button>

      <a routerLink="">
        <!-- <mat-icon>home</mat-icon> -->
        <span [translate]="'app.title'">ختمة.نت</span>
      </a>

      <span class="spacer"></span>

      <!-- Light or dark (theme.ts): the icon shows the look it switches to. -->
      <button type="button" mat-icon-button class="theme-toggle" (click)="toggleTheme()"
        [attr.aria-label]="common.translation.menu?.darkMode || 'الوضع الداكن'" [attr.aria-pressed]="darkTheme()">
        <mat-icon>{{ darkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- <mat-icon
      class="lang-toggle"
      aria-hidden="false"
      aria-label="Language"
      (click)="showLang = !showLang"
      >language
    </mat-icon> -->

    <!-- The globe and the bell: buttons the size of their icon (app.component.scss). -->
    <button type="button" class="toolbar-icon language-btn" [matMenuTriggerFor]="langMenu"
      [attr.aria-label]="common.translation.menu?.language || 'اللغة'">
      <mat-icon>language</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu" [class.dark]="isDarkStyle">
      @for (lang of common.languages; track lang) {
        <button
          mat-menu-item
          (click)="changeLanguage(lang.value)"
          >
          <!-- <mat-icon></mat-icon> -->
          {{ lang.text }}
        </button>
      }
    </mat-menu>

    <!-- <mat-nav-list *ngIf="showLang" class="lang-list">
    <mat-list-item *ngFor="let lang of common.languages">
      <a href="javascript:;" (click)="changeLanguage(lang.value)">{{ lang.text }}</a>
    </mat-list-item>
  </mat-nav-list> -->

  <!-- <mat-form-field appearance="fill" class="lang-dropdown">
  <mat-icon aria-hidden="false" aria-label="Language">language</mat-icon>
  <mat-select [(value)]="common.currentLanguage">
    <mat-option value="ar">العربية</mat-option>
    <mat-option value="en">English</mat-option>
  </mat-select>
</mat-form-field> -->

<button type="button" class="toolbar-icon" (click)="showNotification()" gaEvent="show_notification_clicked"
  gaCategory="notifications" [attr.aria-label]="common.translation.menu?.notifications || 'الإشعارات'">
  <mat-icon
    matBadge="1"
    matBadgePosition="before"
    matBadgeSize="medium"
    matBadgeColor="accent"
    [matBadgeHidden]="!unreadNotification"
    >notifications
  </mat-icon>
</button>

<a routerLink="about" class="toolbar-icon" [attr.aria-label]="common.translation.about?.title || 'شرح الاستخدام'">
  <mat-icon class="help-btn">help_outline</mat-icon>
</a>
</mat-toolbar>
    }

<div id="app-content">
  <router-outlet></router-outlet>
</div>

@if (isOffline) {
  <div class="offline-bar" role="status">
    <span [translate]="'network.offline'">لا يوجد اتصال بالإنترنت. ما تغيّره يُحفظ ويُرسَل عند عودة الاتصال.</span>
  </div>
}
</div>
</div>
