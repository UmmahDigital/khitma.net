<div class="center-center fx-row-wrap" style="height: 100%">
  <div id="app-container" [class.dark]="isDarkStyle" [class.wide]="isWide">
    @if (showCelebration) {
      <app-celebration class="celebration-container">
      </app-celebration>
    }

    @if (!isWide) {
    <mat-toolbar color="primary">
      <button mat-icon-button aria-label="menu">
        <mat-icon (click)="openMenu()">menu</mat-icon>
      </button>

      <a routerLink="">
        <!-- <mat-icon>home</mat-icon> -->
        <span [translate]="'app.title'">ختمة.نت</span>
      </a>

      <span class="spacer"></span>

      <!-- <mat-icon
      class="lang-toggle"
      aria-hidden="false"
      aria-label="Language"
      (click)="showLang = !showLang"
      >language
    </mat-icon> -->

    <mat-icon
      aria-label="Language"
      [matMenuTriggerFor]="langMenu"
      style="margin-inline-start: 8px"
      >language
    </mat-icon>
    <mat-menu #langMenu="matMenu" [class.dark]="isDarkStyle">
      @for (lang of common.languages; track lang) {
        <button
          mat-menu-item
          (click)="changeLanguage(lang.value)"
          >
          <!-- <mat-icon></mat-icon> -->
          {{ lang.text }}
        </button>
      }
    </mat-menu>

    <!-- <mat-nav-list *ngIf="showLang" class="lang-list">
    <mat-list-item *ngFor="let lang of common.languages">
      <a href="javascript:;" (click)="changeLanguage(lang.value)">{{ lang.text }}</a>
    </mat-list-item>
  </mat-nav-list> -->

  <!-- <mat-form-field appearance="fill" class="lang-dropdown">
  <mat-icon aria-hidden="false" aria-label="Language">language</mat-icon>
  <mat-select [(value)]="common.currentLanguage">
    <mat-option value="ar">العربية</mat-option>
    <mat-option value="en">English</mat-option>
  </mat-select>
</mat-form-field> -->

<mat-icon
  matBadge="1"
  matBadgePosition="before"
  matBadgeSize="medium"
  matBadgeColor="accent"
  (click)="showNotification()"
  [matBadgeHidden]="!unreadNotification"
  gaEvent="show_notification_clicked"
  gaCategory="notifications"
  >notifications
</mat-icon>

<a routerLink="about" [attr.aria-label]="common.translation.about?.title || 'شرح الاستخدام'">
  <mat-icon class="help-btn">help_outline</mat-icon>
</a>
</mat-toolbar>
    }

<div id="app-content">
  <router-outlet></router-outlet>
</div>

@if (isOffline) {
  <div class="offline-bar" role="status">
    <span [translate]="'network.offline'">لا يوجد اتصال بالإنترنت. ما تغيّره يُحفظ ويُرسَل عند عودة الاتصال.</span>
  </div>
}
</div>
</div>
