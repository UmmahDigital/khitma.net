<h1 mat-dialog-title>
    {{title}}
</h1>

@if (message) {
    <div mat-dialog-content>
        <p>{{message}}</p>
    </div>
}

<div mat-dialog-actions>
    <button mat-button (click)="onDismiss()">
        @if (dismiss) {
            <span>{{dismiss}}</span>
        } @else {
            <span [translate]="'dialog.no'">لا</span>
        }
    </button>
    <button mat-raised-button color="primary" class="app-btn-primary" (click)="onConfirm()">
        @if (confirm) {
            <span>{{confirm}}</span>
        } @else {
            <span [translate]="'dialog.yes'">نعم</span>
        }
    </button>
</div>
