<nav class="side-menu">
  <a class="menu-row" routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
    <mat-icon>home</mat-icon><span [translate]="'menu.home'">الرئيسيّة</span>
  </a>
  <a class="menu-row" routerLink="/me/groups" routerLinkActive="active-link">
    <mat-icon>groups</mat-icon><span [translate]="'menu.groups'">مجموعاتي</span>
  </a>
  <a class="menu-row" routerLink="/new" routerLinkActive="active-link">
    <mat-icon>group_add</mat-icon><span [translate]="'menu.group_add'">مجموعة جديدة</span>
  </a>
  <a class="menu-row" routerLink="/quran" routerLinkActive="active-link">
    <mat-icon>menu_book</mat-icon><span [translate]="'menu.book'">المصحف الشريف</span>
  </a>
  <a class="menu-row" routerLink="/about" routerLinkActive="active-link">

<!-- Text size for older eyes: the same size everywhere in the app, kept on this phone (text-size.ts). -->
<div class="text-size-row" role="group" [attr.aria-label]="common.translation.menu?.textSize || 'حجم النص'">
  <span class="text-size-label" [translate]="'menu.textSize'">حجم النص</span>
  <button type="button" mat-stroked-button class="text-size-btn smaller" [disabled]="textSize === 's'" (click)="changeTextSize(-1)"
    [attr.aria-label]="common.translation.menu?.smaller || 'تصغير النص'">{{ common.translation.menu?.textGlyph || 'أ' }}</button>
  <button type="button" mat-stroked-button class="text-size-btn larger" [disabled]="textSize === 'xl'" (click)="changeTextSize(1)"
    [attr.aria-label]="common.translation.menu?.larger || 'تكبير النص'">{{ common.translation.menu?.textGlyph || 'أ' }}</button>
</div>
