@if (group) {
  <section class="khitma-info">
    <header class="title center-center" (click)="isExpanded = !isExpanded;">
      <label>
        {{group.title}}
        @if (group.cycle > 0) {
          <span class="khitma-cycle">
            (
            @if (group.type === KHITMA_GROUP_TYPE.SAME_TASK) {
              <span [translate]="'khitma.task'">
                مهمّة
              </span>
            }
            @if (group.type != KHITMA_GROUP_TYPE.SAME_TASK) {
              <span [translate]="'khitma.khitma'">
                ختمة
              </span>
            }
            {{group.cycle + 1}})
          </span>
        }
      </label>
      <mat-icon>
        {{isExpanded? "expand_less" : "expand_more"}}
      </mat-icon>
    </header>
    @if (isExpanded) {
      <div>
        <label class="author"><span [translate]="'khitma.creator'">مُنشئ المجموعة:</span> {{group.author}} </label>
        <p class="description">
          {{group.description}}
        </p>
        @if (showLink) {
          <label>{{groupLink}}</label>
        }
      </div>
    }
  </section>
}
