<section>

  @if (allowEdit) {
    <span class="center-center tip">
      <strong [translate]="'juz.responsible'">لمسؤول المجموعة:</strong>
      <span [translate]="'juz.intro'">اضغط على الاسم لتعديله، واكتب اسم عضو آخر أو جديد، ثمّ اضغط زرّ الحفظ.</span>
    </span>
  }


  <!-- Rows follow their juz number: each one keeps what the admin is typing while others change their ajza. -->
  @for (juz of ajza; track juz.index) {
    <app-juz [juz]="juz" [isEditMode]="allowEdit"
      [isMyJuz]="myAjzaIndexes.indexOf(juz.index) >=0" (onJuzSelection)="juzClicked($event)"
      (onEdited)="juzEdited($event)">
    </app-juz>
  }
</section>
