@if (pagesStatusesMatrix) {
  <table id='status-table' dir="ltr" cellspacing="0" cellpadding="0">
    <tbody>
      @for (row of pagesStatusesMatrix; track row; let i = $index) {
        <tr>
          @for (isDone of row; track isDone) {
            <td [class.done]="isDone" [class.disabled]="isDone === null">
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
}
