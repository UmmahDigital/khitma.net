<section *ngIf="groups && groups.length > 0">

    <header class="center-center">

        <header [translate]="'me.groups'">مجموعاتي الحاليّة</header>

        <span class="spacer"></span>

        <mat-icon style="color:gray" (click)="showSettings=!showSettings">settings</mat-icon>

    </header>

    <section *ngFor="let group of groups" class="fx-row-wrap group-row">


        <div [ngClass]="showSettings ? 'fx-flex-90' : 'fx-flex-100'">
            <app-group-list-item [group]="group">
            </app-group-list-item>

        </div>

        <div *ngIf="showSettings" class="fx-flex-10 center-center">
            <mat-icon (click)="action(group)">archive</mat-icon>
        </div>


    </section>


</section>
