@if (notification) {
  <button class="close-btn" mat-icon-button mat-dialog-close [aria-label]="common.translation.dialog?.close || 'إغلاق'">
    <mat-icon>close</mat-icon>
  </button>
  <h2 mat-dialog-title dir="auto">{{ notification.title }}</h2>
  <div mat-dialog-content>
    <p class="notification-text" dir="auto">{{ notification.text }}</p>
  </div>
  @if (notification.actions?.length) {
    <div mat-dialog-actions class="notification-actions">
      @for (action of notification.actions; track $index; let first = $first) {
        @if (first) {
          <a mat-raised-button color="primary" class="app-btn-primary" dir="auto" [href]="action.url" (click)="openAction($event, action)"
            gaEvent="notification_action_clicked" gaCategory="notifications">{{ action.text }}</a>
        } @else {
          <a mat-stroked-button dir="auto" [href]="action.url" (click)="openAction($event, action)"
            gaEvent="notification_action_clicked" gaCategory="notifications">{{ action.text }}</a>
        }
      }
    </div>
  }
}
