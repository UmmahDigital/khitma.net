@if (group) {
  <div class="group-invite">
    <app-khitma-info [group]="group" [showLink]="false" [isExpanded]="false"></app-khitma-info>
    <section class="invite-intro">
      <h2 [translate]="'sharing.inviteTitle'">ادعُ أهلك وأصدقاءك</h2>
      <p [translate]="'sharing.inviteText'">كلّ من يفتح الرابط يكتب اسمه ويختار جزءًا ليقرأه.</p>
    </section>
    <mat-form-field appearance="fill" class="block">
      <mat-label [translate]="'gInvite.message'">رسالة الدعوة للإنضمام (يمكنك تعديلها)</mat-label>
      <textarea matInput rows="6" [(ngModel)]="inviteMsg" name="invite-msg"></textarea>
    </mat-form-field>
    <button class="block large action-btn whatsapp-btn" mat-flat-button (click)="sendOnWhatsApp()">
      <mat-icon>share</mat-icon> <span [translate]="'sharing.whatsapp'">إرسال عبر واتساب</span>
    </button>
    <div class="invite-more">
      <button mat-stroked-button (click)="share()"><span [translate]="'sharing.other'">مشاركة بطريقة أخرى</span></button>
      <button mat-stroked-button (click)="copy()"><span [translate]="'sharing.copy'">نسخ الرسالة</span></button>
    </div>
    <a mat-button class="block go-to-group" [routerLink]="['/group',group.id]"><span
    [translate]="'gInvite.go'">الانتقال لصفحة مجموعة الختمة</span></a>
  </div>
}
