<h1 mat-dialog-title [translate]="'newKhitma.title'">بدء الختمة التالية</h1>

<div mat-dialog-content>

    <label id="radio-group-label" [translate]="'newKhitma.label'">كيف تُوزَّع الأجزاء؟</label>

    <mat-radio-group aria-labelledby="radio-group-label" class="radio-group" [(ngModel)]="newCycleState">

        <mat-radio-button class="radio-button" [value]="KHITMA_CYCLE_TYPE.AUTO_BOOK">
            <span [translate]="'newKhitma.autoBook'">حجز الجزء التالي لكل عضو</span>
        </mat-radio-button>

        <mat-radio-button class="radio-button" [value]="KHITMA_CYCLE_TYPE.AUTO_BOOK_FOR_DONE_ONLY">
            <span [translate]="'newKhitma.autoBookDone'">حجز الجزء التالي لمن أتمّ جزءه فقط</span>
        </mat-radio-button>

        <mat-radio-button class="radio-button" [value]="KHITMA_CYCLE_TYPE.ALL_IDLE">
            <span [translate]="'newKhitma.allIdle'">إتاحة جميع الأجزاء للاختيار</span>
        </mat-radio-button>

        <mat-radio-button class="radio-button" [value]="KHITMA_CYCLE_TYPE.REWIND" [disabled]="group.cycle <= 0">
            <span [translate]="'newKhitma.rewind'">حجز الجزء السابق لكل عضو</span>
        </mat-radio-button>

    </mat-radio-group>

</div>

<div mat-dialog-actions>
    <button mat-button (click)="onDismiss()"><span [translate]="'newKhitma.cancel'">إلغاء</span></button>
    <button mat-raised-button type="submit" class="action-btn" (click)="onConfirm()"><span [translate]="'newKhitma.ok'">بدء</span></button>
</div>
